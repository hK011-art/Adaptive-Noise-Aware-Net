# Model D: Near-capacity-matched fixed U-Net (3.20M params) with heteroscedastic noise and Noise-DA
model:
  name: "Model_D"
  architecture: "fixed_unet"
  base_channels: 32
  is_adaptive: false
  use_da: true

noise:
  type: "snic"
  sensor: "mobile_sensor_inspired_heuristic"  # Heuristic proxy inspired by mobile sensor parameters
  iso_list: [100.0, 200.0, 400.0, 800.0]

da:
  beta_max: 0.2
  gamma_rate: 5.0
  margin: 0.1

training:
  learning_rate: 0.0001
  batch_size: 16
  epochs: 50
  seed: 42
  checkpoint_dir: "checkpoints"

