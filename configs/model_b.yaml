# Model B: AWGN baseline with Noise-DA diffusion adaptation
model:
  name: "Model_B"
  architecture: "fixed_unet"
  base_channels: 64
  is_adaptive: false
  use_da: true

noise:
  type: "awgn"
  sigma_min: 0.0
  sigma_max: 75.0

da:
  beta_max: 0.2
  gamma_rate: 5.0
  margin: 0.1

training:
  learning_rate: 0.0001
  batch_size: 16
  epochs: 50
  seed: 42
  checkpoint_dir: "checkpoints"

